<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00cc7a"/>
      <stop offset="50%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00cc7a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pulse mark -->
  <g filter="url(#glow)" transform="translate(200 30)">
    <path
      d="M 0 90
         L 70 90
         L 95 30
         L 125 150
         L 160 5
         L 195 165
         L 225 90
         L 300 90"
      fill="none"
      stroke="url(#pulseGrad)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="300" cy="90" r="8" fill="#00ff9d"/>
  </g>

  <!-- Wordmark -->
  <text
    x="400"
    y="260"
    font-family="Courier New, monospace"
    font-size="42"
    font-weight="700"
    letter-spacing="6"
    fill="#ffffff"
    text-anchor="middle"
  >PULSE POCKET</text>

  <text
    x="400"
    y="300"
    font-family="Courier New, monospace"
    font-size="16"
    letter-spacing="3"
    fill="#666666"
    text-anchor="middle"
  >REAL-TIME SOLANA NARRATIVE INTELLIGENCE</text>
</svg>
